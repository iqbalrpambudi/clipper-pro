name: cliper-pro-prod

x-api-env: &api-env
  DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///app/storage/cliper.db}
  STORAGE_PATH: /app/storage
  MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-2147483648}
  MAX_SOURCE_DURATION_MINS: ${MAX_SOURCE_DURATION_MINS:-30}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3030,http://127.0.0.1:3030,http://localhost:8080}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dGhpcy1pcy1hLTMyLWJ5dGUtc2VjcmV0LWtleS1mb3ItZGI=}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gemini-2.0-flash}
  AI_VISION_MODEL: ${AI_VISION_MODEL:-gemini-2.0-flash}
  TTS_PROVIDER: ${TTS_PROVIDER:-gemini}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE:-Puck}
  HF_HOME: /app/.cache/huggingface

services:
  web:
    build:
      context: ../../apps/web
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3030}:3030"
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:8080
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ../../apps/api
      target: prod
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment: *api-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../storage:/app/storage

volumes:
  cliper_hf_cache:
