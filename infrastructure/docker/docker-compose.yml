name: cliper-pro

x-api-env: &api-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://cliper:cliper@postgres:5432/cliper_db}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  STORAGE_PATH: /app/storage
  MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-2147483648}
  MAX_SOURCE_DURATION_MINS: ${MAX_SOURCE_DURATION_MINS:-30}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3030,http://127.0.0.1:3030,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dGhpcy1pcy1hLTMyLWJ5dGUtc2VjcmV0LWtleS1mb3ItZGI=}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gemini-2.0-flash}
  AI_VISION_MODEL: ${AI_VISION_MODEL:-gemini-2.0-flash}
  TTS_PROVIDER: ${TTS_PROVIDER:-gemini}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE:-Puck}
  HF_HOME: /app/.cache/huggingface
  WATCHFILES_FORCE_POLLING: "true"

x-api-build: &api-build
  context: ../../apps/api
  target: dev

services:
  web:
    build:
      context: ../../apps/web
      target: dev
    ports:
      - "${WEB_PORT:-3030}:3030"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      INTERNAL_API_URL: http://api:8080
      WATCHPACK_POLLING: "true"
    volumes:
      - ../../apps/web:/app
      - cliper_web_node_modules:/app/node_modules
      - cliper_web_next:/app/.next
    depends_on:
      api:
        condition: service_started

  api:
    build: *api-build
    ports:
      - "${API_PORT:-8080}:8080"
    environment: *api-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../apps/api:/app
      - ../../storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: *api-build
    command: ["arq", "app.workers.WorkerSettings", "--watch", "app"]
    environment: *api-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../apps/api:/app
      - ../../storage:/app/storage
      - cliper_hf_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cliper_db}
      POSTGRES_USER: ${POSTGRES_USER:-cliper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cliper}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - cliper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cliper} -d ${POSTGRES_DB:-cliper_db}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - cliper_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  cliper_postgres_data:
  cliper_redis_data:
  cliper_web_node_modules:
  cliper_web_next:
  cliper_hf_cache:
