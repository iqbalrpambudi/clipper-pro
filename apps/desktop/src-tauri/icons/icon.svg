<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0835A"/>
      <stop offset="1" stop-color="#A9492A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5a210c" flood-opacity="0.35"/>
    </filter>
    <!-- diagonal cut through the frame: y = 640 - (x - 300) * 0.283, 30px gap -->
    <clipPath id="top"><polygon points="0,0 1024,0 1024,420 0,710"/></clipPath>
    <clipPath id="bottom"><polygon points="0,740 1024,450 1024,1024 0,1024"/></clipPath>
  </defs>

  <!-- macOS grid: 824px body inside 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <g filter="url(#lift)">
    <!-- upper piece: the short, with play -->
    <g clip-path="url(#top)">
      <rect x="362" y="246" width="300" height="533" rx="56" fill="#FFF8F3"/>
      <path d="M472 343 L472 483 L587 413 Z" fill="#B9552F" stroke="#B9552F" stroke-width="18" stroke-linejoin="round"/>
    </g>
    <!-- lower piece, nudged off the cut: subtitle lines -->
    <g clip-path="url(#bottom)" transform="translate(14 10)">
      <rect x="362" y="246" width="300" height="533" rx="56" fill="#FFF8F3"/>
      <rect x="412" y="672" width="200" height="24" rx="12" fill="#E8A383"/>
      <rect x="447" y="712" width="130" height="24" rx="12" fill="#E8A383"/>
    </g>
  </g>
</svg>
