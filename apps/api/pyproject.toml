[project]
name = "cliper-pro-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.37",
    "asyncpg==0.30.0",
    "arq==0.26.3",
    "redis==5.2.1",
    "python-multipart==0.0.20",
    "scenedetect==0.6.5",
    "opencv-python-headless==4.11.0.86",
    "numpy==2.2.2",
    "faster-whisper==1.1.1",
    "requests>=2.31.0",
    "av==12.3.0",
    "httpx==0.28.1",
    "pgvector==0.3.6",
    "edge-tts>=7.3.1",
    "yt-dlp>=2024.0.0",
    "cryptography==43.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (errors, unused imports/vars)
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (common bugs)
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "B904",  # raise ... from err
    "E712",  # comparison to True/False (frequent in SQLAlchemy boolean clauses)
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy models use forward-reference string annotations resolved by SQLAlchemy mapper at runtime
"app/models/*" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
